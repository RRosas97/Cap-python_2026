[project]
name = "clean"
version = "0.1.0"
description = ""
authors = [
    {name = "RRosas97",email = "ricardo.rosas@axity.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi[standard] (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.4,<0.53.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "alembic (>=1.19.1,<2.0.0)",
    "pyodbc (>=5.3.0,<6.0.0)",
    "bcrypt (==4.3.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "setuptools (>=84.0.0,<85.0.0)",
    "build (>=1.5.0,<2.0.0)",
    "wheel (>=0.48.0,<0.49.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
]

[tool.poetry]
packages = [{include = "fast_api", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pip-audit (>=2.10.1,<3.0.0)",
    "mypy (>=2.3.1,<3.0.0)"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
