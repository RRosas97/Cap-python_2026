[project]
name = "clean"
version = "0.1.0"
description = ""
authors = [
    {name = "Richier9",email = "ricardo.rosas@axity.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "pydantic[email] (>=2.13.4,<3.0.0)",
    "uvicorn (>=0.52.4,<0.53.0)",
    "typer (>=0.27.1,<0.28.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "alembic (>=1.19.1,<2.0.0)",
    "pyodbc (>=5.3.0,<6.0.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "setuptools (>=84.0.0,<85.0.0)",
    "build (>=1.5.0,<2.0.0)",
    "wheel (>=0.48.0,<0.49.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
]

[tool.poetry]
packages = [{include = "clean", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
fast-API = "lab.fast_API.src.cli:main"
